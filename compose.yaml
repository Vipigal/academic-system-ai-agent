services:
  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cruzeiro}
      API_DB_PASSWORD: ${API_DB_PASSWORD:-api}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
      - ./data:/data:ro
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 60

  redis:
    image: redis:8.10.3-trixie
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    command: uvicorn --factory api.bootstrap.app:ApiFactory.create --app-dir src --host 0.0.0.0 --port 8000 --no-access-log --reload --reload-dir src/api
    env_file:
      - path: .env
        required: false
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://api:${API_DB_PASSWORD:-api}@db:5432/${POSTGRES_DB:-cruzeiro}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./src/api:/srv/src/api:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  pgweb:
    image: sosedoff/pgweb:0.17.0
    profiles: [tools]
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-cruzeiro}?sslmode=disable
    ports:
      - "127.0.0.1:${PGWEB_PORT:-8081}:8081"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
