[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-system-ai-agent"
version = "0.1.0"
description = "API e agente de atendimento ao aluno sobre os quatro sistemas do grupo educacional."
requires-python = ">=3.14,<3.15"
dependencies = [
    "asyncpg==0.32.0",
    "dishka==1.10.1",
    "fastapi==0.162.0",
    "langchain==1.4.9",
    "langchain-openai==1.7.4",
    "langfuse==5.2.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "pyjwt==2.15.1",
    "redis==8.1.0",
    "sqlalchemy[asyncio]==2.1.8",
    "tzdata==2026.6",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "flake8==7.5.0",
    "httpx==0.28.1",
    "import-linter==2.15",
    "locust==2.47.0",
    "mypy==2.4.1",
    "pyright==1.1.414",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "pyyaml==6.0.3",
    "types-docker==7.2.0.20261102",
    "types-pyyaml==6.0.12.20261103",
    "ruff==0.17.3",
    "testcontainers[postgres]==4.15.0",
    "wemake-python-styleguide==1.8.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["api*", "evals*"]

[tool.setuptools.package-data]
"api.application.agent" = ["prompts/*.md", "skills/*/SKILL.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
norecursedirs = ["fixtures"]
addopts = "--strict-markers --strict-config"
markers = [
    "unit: teste sem banco, aplicado por pasta",
    "integration: teste contra o banco, aplicado por pasta",
    "sweep: varre muitas pessoas ou confere volume contra o oráculo",
    "slow: leva mais de 5 segundos",
    "live: chama o provedor de LLM; só roda com --live",
]

[tool.coverage.run]
relative_files = true
source = ["src"]
