[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-system-ai-agent"
version = "0.1.0"
description = "API e agente de atendimento ao aluno sobre os quatro sistemas do grupo educacional."
requires-python = ">=3.14,<3.15"
dependencies = [
    "asyncpg==0.32.0",
    "fastapi==0.162.0",
    "pydantic==2.14.2",
    "pydantic-ai-slim==2.66.0",
    "pydantic-settings==2.16.2",
    "sqlalchemy[asyncio]==2.1.8",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "flake8==7.5.0",
    "httpx==0.28.1",
    "import-linter==2.15",
    "mypy==2.4.1",
    "pyright==1.1.414",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.3",
    "wemake-python-styleguide==1.8.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
norecursedirs = ["fixtures"]
addopts = "--strict-markers --strict-config"
