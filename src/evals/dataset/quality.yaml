- id: DU-06
  kind: answerable
  split: dev
  question: Que serviços posso pedir na secretaria, quanto custam e quanto demoram?
  student: UniSaoPaulo:180084
  tools:
    expected:
    - list_services
    forbidden: []
  rubric:
  - Diz que os prazos são metas de atendimento
  - 'Separa os serviços com taxa: segunda chamada R$ 45, histórico impresso R$ 20, pacote de ementas R$
    30 e segunda via de diploma R$ 150'
  - Traduz os nomes dos serviços e não cita um histórico digital
  reference: 'São 18 serviços, e os prazos são as metas de atendimento:


    - **Acadêmicos, sem taxa:** trancamento, reativação e cancelamento (72 h); transferência interna e
    migração de matriz (120 h); revisão de nota (168 h).

    - **Acadêmico, com taxa:** prova de segunda chamada, R$ 45 (72 h).

    - **Documentos, sem taxa:** declaração de matrícula (48 h); emissão de diploma (240 h).

    - **Documentos, com taxa:** histórico impresso, R$ 20 (72 h); pacote de ementas, R$ 30 (120 h); segunda
    via de diploma, R$ 150 (240 h).

    - **Financeiros, sem taxa:** novo boleto (48 h); renegociação (72 h); pedido de desconto ou bolsa
    (120 h).

    - **Outros, sem taxa:** problema de acesso ao AVA (48 h); informações gerais (72 h); reclamação (120
    h).'
