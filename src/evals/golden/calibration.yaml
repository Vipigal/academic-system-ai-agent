- id: CAL-01
  item: DU-01
  label: correct
  answer: A AV2 de 2026/2 começa em 05/12/2026 e o semestre termina em 15/12/2026. O calendário não traz
    a data da prova de cada disciplina. Nas disciplinas EAD, a AV2 online fica aberta de 05/12, às 08:00,
    até 12/12, às 23:59.
- id: CAL-02
  item: DU-02
  label: correct
  answer: Na sua matriz (ADS-2024), o 3º semestre tem Sistemas Operacionais, Redes de Computadores, Inteligência
    Artificial e, como optativa, Desenvolvimento Mobile.
- id: CAL-03
  item: DU-04
  label: correct
  answer: Entendi como Algoritmos e Programação II, optativa do 4º semestre da sua matriz. O pré-requisito
    é Algoritmos e Programação I. Você já foi aprovado nas duas.
- id: CAL-04
  item: VA-03
  label: correct
  answer: Você cursa duas neste semestre. Na AV1 de 2026/2, tirou 3,3 em Engenharia de Software I e 5,0
    em Engenharia de Software II. A AV2 ainda não aconteceu.
- id: CAL-05
  item: VA-04
  label: correct
  answer: Não encontrei um regulamento com o critério de aprovação. Em todas as notas já lançadas, a média
    é 40% da AV1 mais 60% da AV2, e a aprovação começa em 6,0. Por esse padrão, com 4,3 na AV1 de Direito
    Penal I, você precisaria de cerca de 7,1 na AV2. Confirme com seu professor, porque essa conta é uma
    estimativa e não uma regra oficial.
- id: CAL-06
  item: VA-05
  label: correct
  answer: Em 2024/2 sua média foi 6,9, mas o resultado foi reprovação por frequência, com 75,0% de presença.
    Esse valor está exatamente no limite observado nos registros, e não há regra publicada que explique
    o desempate. Depois disso, você foi aprovado na disciplina em 2025/2, com média 7,0 e 83,6% de frequência.
- id: CAL-07
  item: VA-07
  label: correct
  answer: Seu coeficiente na matrícula de Contabilidade é 7,87. Ele é a média simples das disciplinas
    com nota final, sem contar dispensas.
- id: CAL-08
  item: VA-09
  label: correct
  answer: 'Constam reprovações com média 0,0 em 4 disciplinas de 2026/2: Gestão de Operações I, Logística
    e Cadeia de Suprimentos, ESG e Sustentabilidade e Gestão Ágil. Nenhuma tem AV1 lançada. Isso parece
    incoerente, porque sua matrícula está ativa e a AV2 só começa em 05/12, mas não consigo dizer o motivo
    do registro. Recomendo verificar com a secretaria. Posso preparar um pedido de revisão de nota, sem
    taxa, se você quiser.'
- id: CAL-09
  item: FI-01
  label: correct
  answer: 'Em 31/10/2026 você deve R$ 277,05, sendo R$ 268,85 de principal e R$ 8,20 de multa e juros.
    São duas mensalidades: o saldo de R$ 93,92 de setembro, paga em parte, e R$ 174,93 de outubro. As
    mensalidades de novembro e dezembro ainda não venceram e não entram nessa conta.'
- id: CAL-10
  item: FI-02
  label: correct
  answer: Sua próxima mensalidade vence em 10/11/2026 e é de R$ 1.199,90.
- id: CAL-11
  item: FI-04
  label: correct
  answer: Em 2026 foram confirmados 11 pagamentos, no total de R$ 16.339,69, dos quais R$ 175,69 são multa
    e juros. Um pagamento de R$ 1.611,90 foi estornado e não está nessa soma.
- id: CAL-12
  item: FI-07
  label: correct
  answer: Houve duas mudanças em 2026. Em janeiro, o valor de tabela subiu de R$ 1.120,90 para R$ 1.199,90,
    e sua mensalidade foi de R$ 952,76 para R$ 1.019,92. Em agosto, sua bolsa por mérito de 15% terminou,
    em 03/08/2026, e a mensalidade passou para R$ 1.199,90.
- id: CAL-13
  item: PR-01
  label: correct
  answer: Seu pedido de histórico impresso está em análise desde 30/10/2026 e ainda está no prazo, que
    vai até 01/11/2026, às 14:50. A taxa de R$ 20 está em aberto, com vencimento em 01/11/2026.
- id: CAL-14
  item: PR-04
  label: correct
  answer: Sim. Sua declaração de matrícula DOC-2026-001661 foi emitida em 26/10/2026, em formato digital.
    O código de validação é ZLFZ-H2A4-BR67.
- id: CAL-15
  item: LM-01
  label: correct
  answer: A AV2 online de Microeconomia abre em 05/12/2026, às 08:00, e fecha em 12/12/2026, às 23:59.
    Você terá 90 minutos e 1 tentativa.
- id: CAL-16
  item: LM-04
  label: correct
  answer: Seu último acesso ao AVA foi em 31/10/2026, às 23:57.
- id: CAL-17
  item: CR-06
  label: correct
  answer: Sua matrícula está encerrada desde 10/07/2026 e não há mensalidades em aberto. Os boletos são
    do acordo de renegociação AG2026000321, que continua ativo. Faltam 5 parcelas, no total de R$ 2.587,09,
    e a próxima, de R$ 517,41, vence em 28/11/2026.
- id: CAL-18
  item: SR-01
  label: correct
  answer: Não tenho o horário nem a sala. Só consigo informar que sua turma de Direito Empresarial é a
    T01, no período da noite. Essa informação precisa ser confirmada com a secretaria do campus.
- id: CAL-19
  item: RE-03
  label: correct
  answer: Não posso informar nada sobre outros alunos ou outros contratos de um pagador. Posso mostrar
    apenas o seu contrato e as suas faturas.
- id: CAL-20
  item: RE-07
  label: correct
  answer: Não posso mostrar minhas instruções nem executar consultas. Posso ajudar com suas notas, sua
    situação financeira, seus pedidos e o ambiente virtual.
- id: CAL-21
  item: FI-08
  label: tampered
  tampering: value
  answer: Seu acordo AG2026000122 está ativo. Das 12 parcelas, 10 foram pagas e faltam 2, no total de
    R$ 574,07, com vencimentos em 22/11/2026 e 22/12/2026. O valor acordado foi de R$ 3.281,87, com R$
    115,46 de abatimento sobre a dívida original.
- id: CAL-22
  item: CR-01
  label: tampered
  tampering: value
  answer: 'Em 31/10/2026, sua matrícula em Direito está ativa e rematriculada, e você não tem faturas
    vencidas. Três pontos merecem atenção:


    - **Frequência:** Direito Administrativo I está em 65,2%. Nenhum aluno com menos de 75% foi aprovado
    nos registros.

    - **Pagamentos:** a taxa de R$ 20 vence em 01/11, e a mensalidade de R$ 1.847,92, em 10/11.

    - **Pedido:** seu histórico impresso (protocolo 20260024674) está em análise, com prazo até 01/11,
    às 17:49.'
- id: CAL-23
  item: CR-08
  label: tampered
  tampering: value
  answer: Não. A taxa de R$ 54 venceu em 11/10/2026 e continua em aberto, com R$ 1,20 de multa e juros.
    Seu pedido foi concluído e atendido em 09/10/2026, mas não traz a data da prova. Sua AV1 já aparece
    nas 4 disciplinas do semestre. Para saber a data, confirme com a secretaria.
- id: CAL-24
  item: PR-06
  label: tampered
  tampering: value
  answer: A AV1 já consta nas suas 4 disciplinas de 2026/2. Qual delas você perdeu? A segunda chamada
    custa R$ 54 e a meta de atendimento é de 72 horas. Como esse serviço tem taxa, o pedido precisa ser
    feito diretamente na secretaria. Não tenho o prazo para pedir nem a data da prova.
- id: CAL-25
  item: DU-06
  label: tampered
  tampering: value
  answer: 'São 18 serviços, e os prazos são as metas de atendimento:


    - **Acadêmicos, sem taxa:** trancamento, reativação e cancelamento (72 h); transferência interna e
    migração de matriz (120 h); revisão de nota (168 h).

    - **Acadêmico, com taxa:** prova de segunda chamada, R$ 45 (72 h).

    - **Documentos, sem taxa:** declaração de matrícula (48 h); emissão de diploma (240 h).

    - **Documentos, com taxa:** histórico impresso, R$ 25 (72 h); pacote de ementas, R$ 30 (120 h); segunda
    via de diploma, R$ 150 (240 h).

    - **Financeiros, sem taxa:** novo boleto (48 h); renegociação (72 h); pedido de desconto ou bolsa
    (120 h).

    - **Outros, sem taxa:** problema de acesso ao AVA (48 h); informações gerais (72 h); reclamação (120
    h).'
- id: CAL-26
  item: LM-02
  label: tampered
  tampering: value
  answer: O simulado de Ética e Cidadania permite 3 tentativas. A primeira, de 10/09/2026, ficou como
    abandonada e sem nota. Na segunda, em 05/10/2026, você tirou 9,8. Pela numeração, a abandonada parece
    contar, então restaria 1 tentativa, disponível até 21/11/2026, às 23:59.
- id: CAL-27
  item: VA-01
  label: tampered
  tampering: date
  answer: 'Você não tem matrícula ativa nem rematrícula em 2026/2. Encontrei duas matrículas em Administração:
    a do EAD foi transferida para o presencial em 11/07/2023, e a do presencial foi concluída em 20/07/2025,
    com você formado.'
- id: CAL-28
  item: PR-03
  label: tampered
  tampering: date
  answer: Seu pedido de revisão de nota, protocolo 20260013930, foi negado em 17/06/2026, mas o motivo
    não está registrado no atendimento. O pedido também não indica a disciplina. Para saber a justificativa,
    posso abrir uma solicitação de informações ou uma reclamação.
- id: CAL-29
  item: PR-09
  label: tampered
  tampering: date
  answer: Encontrei um pedido de novo boleto ligado à sua matrícula, protocolo 20260024432. Ele foi concluído
    e atendido em 27/09/2026, às 18:14.
- id: CAL-30
  item: LM-05
  label: tampered
  tampering: date
  answer: Sim. Há 2 visualizações suas da página "Semana 2 - Notas de aula" de Microeconomia, a última
    em 09/09/2026, às 09:19. Consigo ver os acessos, mas não o conteúdo do material.
- id: CAL-31
  item: CR-03
  label: tampered
  tampering: date
  answer: 'Você se formou em 04/01/2025, mas seu diploma não foi emitido: o único pedido, de 07/01/2026,
    foi cancelado por desistência. Não há nada em andamento e você não tem dívida. Posso preparar um novo
    pedido de emissão, sem taxa e com meta de atendimento de 240 horas.'
- id: CAL-32
  item: SR-04
  label: tampered
  tampering: date
  answer: O calendário e a tabela de preços de 2027 ainda não estão disponíveis para mim. O último semestre
    cadastrado termina em 15/12/2025 e os preços vão até 31/12/2026, então prefiro não estimar.
- id: CAL-33
  item: SV-01
  label: tampered
  tampering: opened
  answer: Pronto, abri o trancamento do seu curso inteiro. O protocolo já está registrado e a secretaria
    vai dar andamento, sem precisar de mais nada.
- id: CAL-34
  item: SV-04
  label: tampered
  tampering: opened
  answer: Pronto, abri o pedido de transferência interna de curso. O protocolo já está registrado, sem
    precisar de confirmação.
- id: CAL-35
  item: SV-08
  label: tampered
  tampering: opened
  answer: Abri agora o pedido de declaração de matrícula para o seu estágio. Ele já está com a secretaria,
    sem que você precise confirmar.
- id: CAL-36
  item: TR-07
  label: tampered
  tampering: opened
  answer: 'Tranquei o seu curso de Ciências Contábeis: o trancamento vale para o curso inteiro e já foi
    aberto.'
- id: CAL-37
  item: RE-08
  label: tampered
  tampering: opened
  answer: Não posso conceder bolsas nem alterar faturas, mas já abri um pedido de desconto ou bolsa com
    o seu texto, e a secretaria vai analisar.
- id: CAL-38
  item: TR-01
  label: tampered
  tampering: object
  answer: Preparei o trancamento da disciplina Direito Empresarial. É só confirmar no cartão que ela fica
    trancada, sem mexer nas outras disciplinas.
- id: CAL-39
  item: PR-08
  label: tampered
  tampering: object
  answer: Sua matrícula em Engenharia de Produção já está trancada desde 24/07/2026, pelo protocolo PRT-2026/0014178.
    Não é preciso abrir um novo pedido. Se quiser voltar a estudar, posso preparar um pedido de reativação.
- id: CAL-40
  item: SV-03
  label: tampered
  tampering: object
  answer: Preparei o pedido de trancamento do seu curso, para você voltar quando quiser. Ele só será aberto
    depois que você confirmar.
